name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Ensure Playwright system deps
        run: npx playwright install-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:4173/ironrank/ > /dev/null 2>&1; then
              echo "Preview ready"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: node tests/e2e.mjs

      - name: Run harness evals (SEO, bundle)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          chmod +x scripts/harness/*.sh
          SITE_URL=https://rafagandia.com/ironrank ./scripts/harness/evals.sh

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/opencode/*.png
            /tmp/opencode/*.log
          if-no-files-found: ignore
          retention-days: 3
