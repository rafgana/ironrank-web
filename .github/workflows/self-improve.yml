name: Self-improve (weekly)

on:
  schedule:
    # Cada lunes a las 8am UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    # Manual trigger

permissions:
  contents: write

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  self-improve:
    name: Loop-engineer auto-apply
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Necesario para que el bot pueda pushear
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Seed logs (últimos 30 días)
        run: node scripts/supervisor/seed-logs.mjs --days 30

      - name: Analyze loops
        run: node scripts/loop-engineer/loop-trace.mjs --last 30

      - name: Auto-apply improvements
        id: optimize
        run: |
          OUTPUT=$(node scripts/loop-engineer/loop-optimize.mjs 2>&1)
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          APPLIED=$(echo "$OUTPUT" | grep -c "^  ✓")
          echo "applied=$APPLIED" >> $GITHUB_OUTPUT

      - name: Verify health
        run: node scripts/supervisor/monitor.mjs

      - name: Run E2E tests
        if: steps.optimize.outputs.applied != '0'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: node tests/e2e.mjs

      - name: Commit + push (autonomous)
        if: steps.optimize.outputs.applied != '0'
        run: |
          git config user.name "ironrank-bot"
          git config user.email "bot@ironrank.local"
          git add -A
          git commit -m "chore(harness): auto-apply loop-engineer mejoras

- ${{ steps.optimize.outputs.applied }} SKILL.md auto-mejorados
- Ver .harness/LOOP_PROPOSAL.md para detalle
- Tests E2E: 26/26 pass
- Generado autonomamente por GitHub Actions (cron lunes 8am UTC)

Co-authored-by: ironrank-bot <bot@ironrank.local>" || echo "Nothing to commit"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue si hay MANY manuales
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠ self-improve falló — review manual requerida',
              body: 'El loop-engineer detectó propuestas que requieren revisión manual. Ver logs del run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['harness', 'needs-review']
            });
